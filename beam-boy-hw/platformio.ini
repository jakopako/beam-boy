; Beam Boy firmware
;
; Two environments share all source: the ESP8266 (NodeMCU) is used for early
; bring-up while the ESP32-S3 board ships. Board-specific details are confined
; to src/core/board_config.h.

[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
    makuna/NeoPixelBus@^2.7.9

; Bring-up board. NeoPixelBus's DMA method drives the strip from the I2S
; peripheral, whose output is fixed to GPIO3 (RX) -- this shares the pin with
; serial input, so uploads are unaffected but Serial.read() is not usable.
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
board_build.filesystem = littlefs

; Same board, but for the 10 px development strip used while the 50 px tube is
; in transit. Games work in normalised coordinates, so nothing above the Display
; layer needs to change when switching between the two.
[env:nodemcuv2-10px]
platform = espressif8266
board = nodemcuv2
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DBEAMBOY_PIXEL_COUNT=10

; Target board: Adafruit ESP32-S3 Feather, 8 MB flash, no PSRAM.
[env:adafruit_feather_esp32s3_nopsram]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
