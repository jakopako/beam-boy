; Beam Boy firmware
;
; Three board environments share all source: the S3 DevKitC (bring-up/dev) and
; the Feather (shipping target) are both ESP32-S3, plus the native host-test
; environment. Board-specific details are confined to src/core/board_config.h.
;
; The ESP8266 was used for early bring-up before any ESP32 hardware was on
; hand, and was dropped once WiFi provisioning proved permanently unreliable
; on it -- see docs/phase-4-wifi.md for the investigation. Its environments and
; every ESP8266-specific code path have been removed.

[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
    makuna/NeoPixelBus@^2.7.9

; Bring-up/dev board: Espressif ESP32-S3-DevKitC-1 N16R8 (16 MB flash, 8 MB
; octal PSRAM), driving the 10 px development strip while the 50 px tube is in
; transit. Games work in normalised coordinates, so nothing above the Display
; layer needs to change when switching to the tube.
;
; This is the Feather config in all respects except power: the DevKitC has no
; LiPo charger and no battery-sense divider, so it runs from USB only. Anything
; battery-related must be developed on the Feather.
;
; The stock board definition is the N8 variant (8 MB, no PSRAM), so flash size,
; partition table and PSRAM mode are overridden below.
[env:esp32-s3-devkitc-1-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBEAMBOY_BOARD_S3_DEVKIT
    -DBEAMBOY_PIXEL_COUNT=10

; Target board: Adafruit ESP32-S3 Feather, 8 MB flash, no PSRAM.
[env:adafruit_feather_esp32s3_nopsram]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; Host tests. Runs on the PC with no board attached, so the pure logic in the
; engine can be checked in a second rather than by flashing and playing.
;
; What this can and cannot do is worth being clear about. It covers logic that
; is a function of time and input -- debounce, auto-repeat, fades, scoring,
; accumulators -- because hostshim/ makes the clock and the pins variables the
; test sets. It cannot cover anything whose behaviour *is* the hardware: WiFi
; driver re-entrancy, DMA timing, or the cont stack overflow that caused the
; sinf crash on the (now-removed) ESP8266 target. Those are found on the
; device, and the way to keep them from recurring is the invariant tests in
; test_soak plus the notes in PLAN.md.
;
; test_build_src is what pulls src/ into the test binary; without it only the
; test files themselves are compiled.
[env:native]
platform = native
framework =
test_build_src = yes
build_flags =
    -Wall
    -DBEAMBOY_NATIVE
    -DBEAMBOY_PIXEL_COUNT=50
    -std=c++17
    -Isrc
    -Ihostshim
build_src_filter =
    +<core/display.cpp>
    +<core/input.cpp>
    +<core/storage.cpp>
lib_deps =