; Beam Boy firmware
;
; Three board environments share all source: the S3 DevKitC (bring-up/dev) and
; the Feather (shipping target) are both ESP32-S3, plus the native host-test
; environment. Board-specific details are confined to src/core/board_config.h.
;
; The ESP8266 was used for early bring-up before any ESP32 hardware was on
; hand, and was dropped once WiFi provisioning proved permanently unreliable
; on it -- see docs/phase-4-wifi.md for the investigation. Its environments and
; every ESP8266-specific code path have been removed.

[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
    makuna/NeoPixelBus@^2.7.9

; Bring-up/dev board: Espressif ESP32-S3-DevKitC-1 N16R8 (16 MB flash, 8 MB
; octal PSRAM), driving the 10 px development strip while the 50 px tube is in
; transit. Games work in normalised coordinates, so nothing above the Display
; layer needs to change when switching to the tube.
;
; This is the Feather config in all respects except power: the DevKitC has no
; LiPo charger and no battery-sense divider, so it runs from USB only. Anything
; battery-related must be developed on the Feather.
;
; The stock board definition is the N8 variant (8 MB, no PSRAM), so flash size,
; partition table and PSRAM mode are overridden below.
[env:esp32-s3-devkitc-1-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
board_build.embed_files = cert/x509_crt_bundle.bin
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBEAMBOY_BOARD_S3_DEVKIT
    -DBEAMBOY_PIXEL_COUNT=10

; Target board: Adafruit ESP32-S3 Feather, 8 MB flash, no PSRAM.
;
; ⚠️ This board enumerates as *two different USB devices*, and confusing them
; wastes an afternoon. The USB-C socket is wired straight to the S3's native
; USB pins -- there is no UART bridge, so there is no DTR/RTS line physically
; connected to EN/GPIO0:
;
;   running firmware   239A:8113  Adafruit TinyUSB CDC   <- what to monitor
;   ROM download mode  303A:1001  Espressif USB-Serial-JTAG
;
; They get different COM numbers, and only one exists at a time. Consequences:
;
;   * esptool's closing "Hard resetting via RTS pin..." does nothing here, so
;     after a flash the chip stays in the ROM bootloader. The console looks
;     frozen -- no launcher, no stick -- because the firmware is not running.
;     **Tap RESET after uploading.** That is the reset esptool could not do.
;   * Auto-detection picks whichever port exists when the upload starts, which
;     for a monitor is a coin flip: attach to the bootloader's port and it
;     prints nothing at all, forever. monitor_port below pins it to the
;     application device by USB id, so it can only ever open the right one.
;
; upload_port is deliberately left on auto-detect: in download mode the
; bootloader's port is the only one present, so auto-detect cannot get it
; wrong, and pinning it would break the 1200 bps auto-reset path on the
; occasions that does work.
;
; Do NOT set monitor_dtr = 0 here. The native-USB CDC stack uses DTR to decide
; a terminal is attached; without it `Serial` never goes true and the firmware
; prints into a void.
;
; board_build.partitions overrides Adafruit's stock partitions-8MB-tinyuf2.csv,
; whose only data partition is `ffat` with subtype `fat`. Arduino's
; LittleFS.begin() looks up a DATA/SPIFFS partition named "spiffs", so on the
; stock table the mount fails every boot and Storage reports UNAVAILABLE --
; while `uploadfs` still appears to succeed, because the uploader writes to the
; data partition by offset without caring about its subtype. See the header of
; partitions-8MB-littlefs.csv.
[env:adafruit_feather_esp32s3_nopsram]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram
board_build.filesystem = littlefs
board_build.partitions = partitions-8MB-littlefs.csv
board_build.embed_files = cert/x509_crt_bundle.bin
monitor_port = hwgrep://239A:8113
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBEAMBOY_PIXEL_COUNT=10

; Host tests. Runs on the PC with no board attached, so the pure logic in the
; engine can be checked in a second rather than by flashing and playing.
;
; What this can and cannot do is worth being clear about. It covers logic that
; is a function of time and input -- debounce, auto-repeat, fades, scoring,
; accumulators -- because hostshim/ makes the clock and the pins variables the
; test sets. It cannot cover anything whose behaviour *is* the hardware: WiFi
; driver re-entrancy, DMA timing, or the cont stack overflow that caused the
; sinf crash on the (now-removed) ESP8266 target. Those are found on the
; device, and the way to keep them from recurring is the invariant tests in
; test_soak plus the notes in PLAN.md.
;
; test_build_src is what pulls src/ into the test binary; without it only the
; test files themselves are compiled.
[env:native]
platform = native
framework =
test_build_src = yes
build_flags =
    -Wall
    -DBEAMBOY_NATIVE
    -DBEAMBOY_PIXEL_COUNT=50
    -std=c++17
    -Isrc
    -Ihostshim
build_src_filter =
    +<core/display.cpp>
    +<core/input.cpp>
    +<core/storage.cpp>
    +<core/json_lite.cpp>
    +<core/store_index.cpp>
lib_deps =